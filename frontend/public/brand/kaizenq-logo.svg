<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main Top-Cyan to Deep-Blue Gradient -->
    <linearGradient id="kq_circle_grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="35%" stop-color="#0094FF" />
      <stop offset="70%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#0033B8" />
    </linearGradient>

    <!-- K & Tail Vibrant Gradient -->
    <linearGradient id="kq_k_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="50%" stop-color="#0058E6" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>

    <!-- Q Tail Gradient -->
    <linearGradient id="kq_tail_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#0094FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Ascending Arrow Gradient -->
    <linearGradient id="kq_arrow_grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="kq_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="kaizenq_logo_group">
    <!-- 1. LEFT AI NETWORK NODES & CIRCUIT TRACKS -->
    <g id="circuit_nodes">
      <!-- Node 1 (Top) -->
      <circle cx="55" cy="210" r="11" stroke="url(#kq_circle_grad)" stroke-width="7" fill="none" />
      <path d="M 68 210 L 115 210 L 138 200 L 140 216 L 122 216 L 68 210" fill="url(#kq_circle_grad)" />

      <!-- Node 2 (Middle-Top) -->
      <circle cx="98" cy="240" r="11" stroke="url(#kq_circle_grad)" stroke-width="7" fill="none" />
      <path d="M 111 240 L 135 240 L 158 230 L 160 248 L 138 248 L 111 240" fill="url(#kq_circle_grad)" />

      <!-- Node 3 (Middle-Bottom - Longest Track) -->
      <circle cx="30" cy="270" r="11" stroke="url(#kq_circle_grad)" stroke-width="7" fill="none" />
      <path d="M 43 270 L 125 270 L 140 258 L 142 278 L 122 278 L 43 270" fill="url(#kq_circle_grad)" />
      <path d="M 130 270 L 160 255 L 160 288 L 130 270" fill="url(#kq_circle_grad)" />

      <!-- Node 4 (Bottom) -->
      <circle cx="80" cy="302" r="11" stroke="url(#kq_circle_grad)" stroke-width="7" fill="none" />
      <path d="M 93 302 L 130 302 L 150 292 L 150 310 L 93 302" fill="url(#kq_circle_grad)" />
    </g>

    <!-- 2. CIRCULAR Q OUTER RING -->
    <!-- Arc from upper left opening around clockwise to lower right -->
    <path d="M 138 185 A 155 155 0 1 1 330 372" fill="none" stroke="url(#kq_circle_grad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lower Left Arc -->
    <path d="M 148 318 A 155 155 0 0 1 140 310" fill="none" stroke="url(#kq_circle_grad)" stroke-width="34" stroke-linecap="round" />

    <!-- 3. BOLD LETTER 'K' -->
    <!-- Vertical Column of K -->
    <path d="M 172 144 L 222 144 L 222 324 L 172 324 Z" fill="url(#kq_k_grad)" />

    <!-- Upper Diagonal Arm of K -->
    <path d="M 222 232 L 305 144 L 358 144 L 260 250 Z" fill="url(#kq_k_grad)" />

    <!-- Lower Diagonal Leg & Outer Q Tail Extension -->
    <path d="M 235 218 L 382 376 L 472 412 L 428 412 L 298 280 L 222 248 Z" fill="url(#kq_k_grad)" />

    <!-- 4. INNER ASCENDING ARROW WITH BASE LEDGE -->
    <!-- Base Platform Ledge -->
    <path d="M 334 298 L 382 298 L 440 376 L 392 376 Z" fill="url(#kq_tail_grad)" />

    <!-- Cyan Upward Arrow -->
    <g id="upward_arrow">
      <path d="M 324 242 L 344 200 L 364 242 L 350 242 L 350 298 L 338 298 L 338 242 Z" fill="url(#kq_arrow_grad)" />
    </g>
  </g>
</svg>
