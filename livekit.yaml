# ==============================================================================
# KAIZENQ LIVEKIT SFU CONFIGURATION (PHASE 2)
# ==============================================================================
# Port architecture:
# - Signaling (HTTP / WebSocket): 7880
# - RTC TCP fallback / TURN TCP: 7881
# - WebRTC Media UDP range: 50000-50200
#
# Authentication keys are injected dynamically via LIVEKIT_KEYS env variable.
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true

logging:
  json: false
  level: info
